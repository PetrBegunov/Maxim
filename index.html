<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secret Inbox | Školní schránka nápadů</title>
<style>
:root{--bg:#0b1220;--panel:#111c2d;--panel2:#16243a;--line:#26364e;--text:#eef4fb;--muted:#9aabc2;--green:#10b981;--green2:#059669;--red:#ef4444;--yellow:#fbbf24}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--green);color:#05251c;font-weight:750}button:hover{filter:brightness(1.08)}button.secondary{background:#223149;color:var(--text);border:1px solid var(--line)}button.danger{background:#4a202a;color:#ffdce0;border:1px solid #7c2938}button.small{padding:6px 9px;font-size:12px;border-radius:8px}input,textarea,select{width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--line);background:#0c1727;color:var(--text);outline:none}textarea{resize:vertical;min-height:100px}label{display:block;color:#cbd7e7;font-size:13px;margin:12px 0 6px}.muted{color:var(--muted)}.tiny{font-size:12px}.topbar{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100% - 1180px)/2));border-bottom:1px solid var(--line);background:#0d1727;position:sticky;top:0;z-index:4}.brand{display:flex;align-items:center;gap:11px;font-size:19px;font-weight:850;letter-spacing:-.4px}.logo{display:grid;place-items:center;width:37px;height:37px;border-radius:11px;background:linear-gradient(135deg,#34d399,#059669);color:#06271e;font-size:20px}.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:0}.top-actions{display:flex;align-items:center;gap:10px}.shell{max-width:1180px;margin:26px auto;padding:0 20px}.hero{border:1px solid #155e51;border-radius:20px;padding:34px;background:radial-gradient(ellipse at 75% 20%,#124d47 0,transparent 45%),linear-gradient(120deg,#102b32,#101c2d 65%);display:flex;justify-content:space-between;gap:25px;align-items:center}.hero h1{font-size:clamp(28px,4vw,43px);line-height:1.12;letter-spacing:-1.4px;margin:0 0 14px;max-width:650px}.hero p{max-width:620px;color:#c0d1dc;margin:0 0 22px}.hero-icon{font-size:82px;color:#6ee7b7;padding:0 25px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.section-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:27px 0 14px}.section-head h2{font-size:20px;margin:0}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters select{width:auto;min-width:150px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:17px;min-width:0}.idea{display:flex;flex-direction:column;gap:10px}.idea h3{margin:0;font-size:17px}.idea p{margin:0;color:#b4c2d4;font-size:13px;white-space:pre-wrap}.tag{display:inline-flex;width:max-content;padding:4px 8px;border-radius:7px;background:#153c36;color:#6ee7b7;font-size:11px;font-weight:750}.meta{font-size:12px;color:var(--muted);display:flex;gap:9px;flex-wrap:wrap}.vote{display:flex;align-items:center;gap:8px}.vote button{padding:7px 10px}.vote strong{min-width:20px;text-align:center}.idea-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;padding-top:8px}.notice{padding:14px 16px;border-radius:12px;background:#102d2b;border:1px solid #1d5b4d;color:#b9f6dc;margin:18px 0}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px}.sidebar{align-self:start;position:sticky;top:90px;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:12px}.navitem{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;color:#c3d0e1;margin:2px 0;padding:11px 12px;border-radius:9px}.navitem.active{background:#12483d;color:#a7f3d0}.content{min-width:0}.page-title{font-size:27px;letter-spacing:-.7px;margin:0 0 4px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:20px 0}.stat{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px}.stat strong{display:block;font-size:27px}.stat span{color:var(--muted);font-size:12px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:570px;background:var(--panel)}th,td{text-align:left;padding:12px 13px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);font-weight:650;background:#101a2a}tr:last-child td{border-bottom:0}.status{font-size:11px;color:#6ee7b7;background:#123b31;padding:4px 8px;border-radius:20px}.status.blocked{color:#fecaca;background:#4a202a}.form-card{max-width:720px}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.comments{display:grid;gap:12px;margin-top:16px}.comment{border-bottom:1px solid var(--line);padding:0 0 12px}.comment:last-child{border:0}.comment strong{font-size:13px}.comment p{margin:5px 0;color:#c3cfdf;font-size:13px;white-space:pre-wrap}.modal-backdrop{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:18px;z-index:10}.modal-backdrop.open{display:grid}.modal{width:min(460px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:23px;box-shadow:0 25px 90px #0009}.modal h2{margin:0 0 5px}.modal-foot{display:flex;gap:8px;margin-top:16px}.modal-foot button{flex:1}.empty{text-align:center;padding:36px 20px;color:var(--muted)}.footer{text-align:center;padding:35px 15px;color:#71829b;font-size:12px}.hidden{display:none!important}.pill{border:1px solid var(--line);padding:7px 10px;border-radius:9px;color:var(--muted);font-size:12px}.inline-link{background:transparent;color:#6ee7b7;padding:0}.detail-head{display:flex;gap:15px;align-items:flex-start}.detail-votes{min-width:75px;text-align:center;background:#0d2e2a;border-radius:12px;padding:12px}.detail-votes strong{display:block;font-size:25px}.detail-votes button{margin-top:7px;width:100%;padding:6px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#e2fff2;color:#064e3b;padding:12px 18px;border-radius:12px;box-shadow:0 8px 30px #0006;z-index:20;font-weight:700}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:1fr}.sidebar{position:static;display:flex;overflow:auto}.navitem{white-space:nowrap;width:auto}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-icon{display:none}.shell{margin-top:18px}}
@media(max-width:560px){.topbar{padding:0 14px;height:62px}.brand{font-size:16px}.top-actions .role-label{display:none}.shell{padding:0 13px}.hero{padding:23px 19px}.hero h1{font-size:30px}.grid{grid-template-columns:1fr}.section-head{align-items:flex-start;flex-direction:column}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:23px}.top-actions button{padding:8px 10px}.sidebar{padding:7px}.navitem{padding:9px;font-size:12px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="logo">✉</div><div>Secret Inbox<small>Školní schránka nápadů</small></div></div>
  <div class="top-actions"><span id="roleLabel" class="role-label muted tiny">Nepřihlášený návštěvník</span><button id="loginTop" onclick="openLogin()">Přihlásit se</button><button id="logoutTop" class="secondary hidden" onclick="logout()">Odhlásit</button></div>
</header>
<main id="app" class="shell"></main>
<div id="modalBackdrop" class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div id="modal" class="modal"></div></div>
<div id="toast" class="toast hidden"></div>
<footer class="footer">Secret Inbox · Školní schránka nápadů · Demo verze pro školní projekt</footer>
<script>
const seedIdeas=[
{id:1,title:"Více posezení ve škole",category:"Prostředí školy",description:"Na chodbách by se hodilo více laviček a pohodlných sedaček, kde bychom mohli odpočívat mezi hodinami.",author:"Anonymní student",anonymous:true,votes:18,comments:[{author:"Tereza S.",text:"Hlavně u učeben ve druhém patře!"},{author:"Petr K.",text:"Souhlasím, o přestávkách není kam sednout."}],created:Date.now()-86400000*2,status:"active",voters:[]},
{id:2,title:"Lepší Wi-Fi na chodbách",category:"Technologie",description:"Wi-Fi často nefunguje, hlavně na vyšších patrech. Bylo by super, kdyby bylo připojení stabilnější.",author:"Petr Kovář",anonymous:false,votes:14,comments:[{author:"Jan Novák",text:"Ve třetím patře je to nejhorší."}],created:Date.now()-86400000*3,status:"active",voters:[]},
{id:3,title:"Kroužek programování",category:"Výuka",description:"Na škole by mohl být kroužek programování pro začátečníky i pokročilé.",author:"Marek",anonymous:false,votes:11,comments:[],created:Date.now()-86400000*4,status:"active",voters:[]},
{id:4,title:"Více sportovního vybavení",category:"Sport",description:"Doplnit vybavení na tělocvik a přidat možnost půjčit si míče i během volné hodiny.",author:"Tereza S.",anonymous:false,votes:9,comments:[],created:Date.now()-86400000*5,status:"active",voters:[]},
{id:5,title:"Výběr jídel v kantýně",category:"Jídelna",description:"Uvítali bychom větší výběr jídel a více bezmasých možností.",author:"Anonymní student",anonymous:true,votes:7,comments:[],created:Date.now()-86400000*6,status:"active",voters:[]}
];
const seedUsers=[
{username:"student",name:"Jan Novák",password:"student123",role:"student",blocked:false},
{username:"admin",name:"Administrátor",password:"admin123",role:"admin",blocked:false},
{username:"tereza",name:"Tereza Svobodová",password:"tereza123",role:"student",blocked:true}
];
let ideas=JSON.parse(localStorage.getItem("si_ideas")||"null")||seedIdeas;
let users=JSON.parse(localStorage.getItem("si_users")||"null")||seedUsers;
let current=JSON.parse(sessionStorage.getItem("si_current")||"null");
let page="home",detailId=null,filterCategory="Vše",sortMode="popular",searchText="";
function save(){localStorage.setItem("si_ideas",JSON.stringify(ideas));localStorage.setItem("si_users",JSON.stringify(users));sessionStorage.setItem("si_current",JSON.stringify(current));}
function role(){return current?.role||"guest"}function isAdmin(){return role()==="admin"}function isStudent(){return role()==="student"||isAdmin()}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(msg){let t=document.getElementById("toast");t.textContent=msg;t.classList.remove("hidden");setTimeout(()=>t.classList.add("hidden"),2400)}
function openModal(html){document.getElementById("modal").innerHTML=html;document.getElementById("modalBackdrop").classList.add("open")}
function closeModal(){document.getElementById("modalBackdrop").classList.remove("open")}
function openLogin(){openModal(`<h2>Přihlášení</h2><p class="muted tiny">Vyber ukázkový účet nebo zadej přihlašovací údaje.</p><form onsubmit="login(event)"><label>Uživatelské jméno</label><input id="loginUser" autocomplete="username" required placeholder="např. student"><label>Heslo</label><input id="loginPass" type="password" autocomplete="current-password" required placeholder="Heslo"><div class="modal-foot"><button type="button" class="secondary" onclick="closeModal()">Zrušit</button><button type="submit">Přihlásit se</button></div></form><div class="notice tiny"><b>Demo účty</b><br>Student: student / student123<br>Admin: admin / admin123</div>`)}
function login(e){e.preventDefault();let u=users.find(x=>x.username===document.getElementById("loginUser").value.trim()&&x.password===document.getElementById("loginPass").value);if(!u){toast("Nesprávné uživatelské jméno nebo heslo.");return}if(u.blocked){toast("Tento účet je zablokovaný.");return}current={username:u.username,name:u.name,role:u.role};save();closeModal();page="home";render();toast("Přihlášení proběhlo úspěšně.")}
function logout(){current=null;page="home";detailId=null;save();render();toast("Byl/a jste odhlášen/a.")}
function go(p){page=p;detailId=null;render();window.scrollTo({top:0,behavior:"smooth"})}
function activeIdeas(){return ideas.filter(i=>i.status!=="deleted")}
function voted(i){return !!current&&i.voters.includes(current.username)}
function vote(id){if(!isStudent()){openLogin();return}let i=ideas.find(x=>x.id===id);if(!i)return;if(i.author===current.name&&!i.anonymous){toast("Pro vlastní návrh hlasovat nelze.");return}if(voted(i)){i.voters=i.voters.filter(v=>v!==current.username);i.votes=Math.max(0,i.votes-1)}else{i.voters.push(current.username);i.votes++}save();render()}
function ideaCard(i){return `<article class="card idea"><span class="tag">${esc(i.category)}</span><h3><button class="inline-link" onclick="showDetail(${i.id})">${esc(i.title)}</button></h3><p>${esc(i.description)}</p><div class="meta"><span>✦ ${esc(i.anonymous?"Anonymní student":i.author)}</span><span>💬 ${i.comments.length} komentářů</span></div><div class="idea-foot"><div class="vote"><button class="${voted(i)?"secondary":""}" onclick="vote(${i.id})" title="Hlasovat">${voted(i)?"✓ Hlasováno":"↑ Hlasovat"}</button><strong>${i.votes}</strong><span class="muted tiny">hlasů</span></div><button class="secondary small" onclick="showDetail(${i.id})">Diskuse →</button></div></article>`}
function render(){document.getElementById("roleLabel").textContent=role()==="guest"?"Nepřihlášený návštěvník":(current.name+(isAdmin()?" · Admin":" · Student"));document.getElementById("loginTop").classList.toggle("hidden",role()!=="guest");document.getElementById("logoutTop").classList.toggle("hidden",role()==="guest");let app=document.getElementById("app");if(page==="home")app.innerHTML=homePage();else if(page==="ideas")app.innerHTML=ideasPage();else if(page==="new")app.innerHTML=newPage();else if(page==="my")app.innerHTML=myPage();else if(page==="admin")app.innerHTML=adminPage();else if(page==="users")app.innerHTML=usersPage();else if(page==="detail")app.innerHTML=detailPage();else if(page==="about")app.innerHTML=aboutPage()}
function homePage(){let best=[...activeIdeas()].sort((a,b)=>b.votes-a.votes).slice(0,3);return `<section class="hero"><div><h1>Máš nápad, jak zlepšit naši školu?</h1><p>Sdílej své nápady, hlasuj pro ty nejlepší a pomoz vytvořit lepší prostředí pro všechny.</p><div class="row"><button onclick="${isStudent()?"go('new')":"openLogin()"}">✦ Přidat nápad</button><button class="secondary" onclick="go('ideas')">Prozkoumat nápady</button></div></div><div class="hero-icon">♧</div></section><div class="notice">💡 <b>Každý nápad se počítá.</b> Navrhni změnu, která by pomohla tobě i ostatním studentům.</div><div class="section-head"><h2>🔥 Nejoblíbenější nápady</h2><button class="secondary" onclick="go('ideas')">Zobrazit všechny →</button></div><div class="grid">${best.map(ideaCard).join("")}</div><div class="section-head"><h2>Jak to funguje?</h2></div><div class="grid"><div class="card"><span class="tag">01 · Navrhni</span><h3>Řekni svůj nápad</h3><p class="muted">Popiš, co by se ve škole mohlo zlepšit.</p></div><div class="card"><span class="tag">02 · Hlasuj</span><h3>Podpoř ostatní</h3><p class="muted">Hlasuj pro návrhy, které mají smysl.</p></div><div class="card"><span class="tag">03 · Diskutuj</span><h3>Vylepšete ho společně</h3><p class="muted">Přidej komentář a rozveď nápad s ostatními.</p></div></div>`}
function ideasPage(){let list=activeIdeas().filter(i=>(filterCategory==="Vše"||i.category===filterCategory)&&(i.title+" "+i.description).toLowerCase().includes(searchText.toLowerCase()));if(sortMode==="popular")list.sort((a,b)=>b.votes-a.votes);else if(sortMode==="new")list.sort((a,b)=>b.created-a.created);else list.sort((a,b)=>a.title.localeCompare(b.title,"cs"));return `<div class="section-head"><div><h1 class="page-title">Školní nápady</h1><div class="muted">Prohlížej návrhy a podpoř ty nejlepší.</div></div>${isStudent()?'<button onclick="go(&quot;new&quot;)">＋ Přidat nápad</button>':'<button onclick="openLogin()">Přihlásit se pro přidání</button>'}</div><div class="row" style="margin:18px 0"><input style="flex:1;min-width:180px" placeholder="🔎 Hledat nápad..." value="${esc(searchText)}" oninput="searchText=this.value;render()"><select onchange="filterCategory=this.value;render()">${["Vše","Prostředí školy","Technologie","Výuka","Sport","Jídelna","Ostatní"].map(c=>`<option ${filterCategory===c?"selected":""}>${c}</option>`).join("")}</select><select onchange="sortMode=this.value;render()"><option value="popular" ${sortMode==="popular"?"selected":""}>Nejvíce hlasů</option><option value="new" ${sortMode==="new"?"selected":""}>Nejnovější</option><option value="az" ${sortMode==="az"?"selected":""}>Abecedně</option></select></div><div class="grid">${list.map(ideaCard).join("")||'<div class="card empty">Žádné nápady tomuto filtru neodpovídají.</div>'}</div>`}
function newPage(){if(!isStudent())return `<div class="card empty"><h2>Pro přidání nápadu se přihlas</h2><button onclick="openLogin()">Přihlásit se</button></div>`;return `<div class="section-head"><div><h1 class="page-title">Přidat nový nápad</h1><div class="muted">Popiš svůj návrh. Slušná a konkrétní zpětná vazba pomáhá.</div></div><button class="secondary" onclick="go('ideas')">← Zpět na nápady</button></div><form class="card form-card" onsubmit="addIdea(event)"><label for="ideaTitle">Název nápadu *</label><input id="ideaTitle" required maxlength="90" placeholder="Např. Více míst k odpočinku"><label for="ideaCategory">Kategorie *</label><select id="ideaCategory" required><option value="">Vyber kategorii</option><option>Prostředí školy</option><option>Technologie</option><option>Výuka</option><option>Sport</option><option>Jídelna</option><option>Ostatní</option></select><label for="ideaDesc">Popis nápadu *</label><textarea id="ideaDesc" required maxlength="1000" placeholder="Co by se mělo změnit a jak by to pomohlo studentům?"></textarea><label class="row" style="margin-top:14px"><input id="ideaAnon" type="checkbox" style="width:auto"> Zveřejnit anonymně</label><div class="form-actions"><button type="button" class="secondary" onclick="go('ideas')">Zrušit</button><button type="submit">Odeslat nápad →</button></div></form>`}
function addIdea(e){e.preventDefault();if(!isStudent())return openLogin();let title=document.getElementById("ideaTitle").value.trim(),description=document.getElementById("ideaDesc").value.trim(),category=document.getElementById("ideaCategory").value;if(!title||!description||!category)return;ideas.unshift({id:Math.max(0,...ideas.map(i=>i.id))+1,title,category,description,author:current.name,anonymous:document.getElementById("ideaAnon").checked,votes:0,comments:[],created:Date.now(),status:"active",voters:[]});save();go("ideas");toast("Nápad byl přidán!")}
function showDetail(id){detailId=id;page="detail";render();window.scrollTo({top:0,behavior:"smooth"})}
function detailPage(){let i=ideas.find(x=>x.id===detailId);if(!i)return `<div class="card empty">Nápad nebyl nalezen. <button onclick="go('ideas')">Zpět</button></div>`;return `<button class="secondary small" onclick="go('ideas')">← Všechny nápady</button><div class="card" style="margin-top:14px"><div class="detail-head"><div class="detail-votes"><strong>${i.votes}</strong><span class="tiny muted">hlasů</span><button onclick="vote(${i.id})">${voted(i)?"✓":"↑"}</button></div><div style="flex:1"><span class="tag">${esc(i.category)}</span><h1 class="page-title" style="margin-top:10px">${esc(i.title)}</h1><div class="meta">Autor: ${esc(i.anonymous?"Anonymní student":i.author)} · ${new Date(i.created).toLocaleDateString("cs-CZ")}</div></div></div><p style="white-space:pre-wrap;color:#c5d2e3;margin-top:22px">${esc(i.description)}</p></div><div class="section-head"><h2>💬 Diskuse (${i.comments.length})</h2></div>${isStudent()?`<form class="card" onsubmit="addComment(event,${i.id})"><label for="commentText">Přidat komentář</label><textarea id="commentText" required maxlength="500" placeholder="Napiš svůj názor nebo návrh na vylepšení..."></textarea><div class="form-actions"><button type="submit">Odeslat komentář</button></div></form>`:`<div class="notice">Pro zapojení do diskuse se <button class="inline-link" onclick="openLogin()">přihlas</button>.</div>`}<div class="card comments">${i.comments.map((c,n)=>`<div class="comment"><div class="row" style="justify-content:space-between"><strong>${esc(c.author)}</strong>${isAdmin()?`<button class="danger small" onclick="deleteComment(${i.id},${n})">Smazat</button>`:""}</div><p>${esc(c.text)}</p></div>`).join("")||'<div class="empty">Zatím tu nejsou žádné komentáře. Začni diskusi!</div>'}</div>${isAdmin()?`<div style="margin-top:15px"><button class="danger" onclick="deleteIdea(${i.id})">Odstranit nápad</button></div>`:""}`}
function addComment(e,id){e.preventDefault();if(!isStudent())return openLogin();let t=document.getElementById("commentText").value.trim();if(!t)return;ideas.find(i=>i.id===id).comments.push({author:current.name,text:t});save();render();toast("Komentář byl přidán.")}
function myPage(){if(!isStudent())return `<div class="card empty"><h2>Přihlas se a spravuj své nápady</h2><button onclick="openLogin()">Přihlásit se</button></div>`;let mine=activeIdeas().filter(i=>!isAdmin()&&i.author===current.name);return `<h1 class="page-title">Moje nápady</h1><p class="muted">Přehled návrhů, které jsi přidal/a.</p><div class="grid" style="margin-top:20px">${mine.map(ideaCard).join("")||'<div class="card empty">Zatím jsi nepřidal/a žádný nápad.</div>'}</div>`}
function adminNav(){return `<aside class="sidebar"><button class="navitem ${page==="admin"?"active":""}" onclick="go('admin')">▦ Přehled</button><button class="navitem ${page==="ideas"?"active":""}" onclick="go('ideas')">☷ Nápady</button><button class="navitem ${page==="users"?"active":""}" onclick="go('users')">♙ Uživatelé</button><button class="navitem" onclick="openCreateUser()">＋ Založit účet</button><button class="navitem" onclick="go('about')">ⓘ O projektu</button></aside>`}
function adminPage(){if(!isAdmin())return `<div class="card empty"><h2>Tato část je jen pro administrátora.</h2><button onclick="openLogin()">Přihlásit se jako admin</button></div>`;let all=activeIdeas();return `<div class="layout">${adminNav()}<section class="content"><h1 class="page-title">Administrace</h1><p class="muted">Správa obsahu a uživatelských účtů.</p><div class="stats"><div class="stat"><span>Celkem nápadů</span><strong>${all.length}</strong></div><div class="stat"><span>Uživatelských účtů</span><strong>${users.length}</strong></div><div class="stat"><span>Zablokované účty</span><strong>${users.filter(u=>u.blocked).length}</strong></div><div class="stat"><span>Všech hlasů</span><strong>${all.reduce((s,i)=>s+i.votes,0)}</strong></div></div><div class="section-head"><h2>Poslední nápady</h2><button class="secondary small" onclick="go('ideas')">Spravovat nápady →</button></div><div class="table-wrap"><table><thead><tr><th>Název</th><th>Autor</th><th>Hlasy</th><th>Akce</th></tr></thead><tbody>${all.slice().sort((a,b)=>b.created-a.created).map(i=>`<tr><td>${esc(i.title)}</td><td>${esc(i.anonymous?"Anonymní":i.author)}</td><td>${i.votes}</td><td><button class="secondary small" onclick="showDetail(${i.id})">Detail</button> <button class="danger small" onclick="deleteIdea(${i.id})">Smazat</button></td></tr>`).join("")}</tbody></table></div><div class="section-head"><h2>Uživatelé</h2><button onclick="openCreateUser()">＋ Založit účet</button></div><div class="table-wrap"><table><thead><tr><th>Uživatel</th><th>Role</th><th>Stav</th><th>Akce</th></tr></thead><tbody>${users.map(u=>`<tr><td>${esc(u.name)}<div class="muted tiny">@${esc(u.username)}</div></td><td>${u.role==="admin"?"Admin":"Student"}</td><td><span class="status ${u.blocked?"blocked":""}">${u.blocked?"Zablokovaný":"Aktivní"}</span></td><td>${u.username!==current.username?`<button class="${u.blocked?"secondary":"danger"} small" onclick="toggleBlock('${esc(u.username)}')">${u.blocked?"Odblokovat":"Blokovat"}</button>`:"<span class='muted tiny'>Aktuální účet</span>"}</td></tr>`).join("")}</tbody></table></div></section></div>`}
function usersPage(){if(!isAdmin())return `<div class="card empty"><h2>Přístup jen pro administrátora.</h2><button onclick="openLogin()">Přihlásit se</button></div>`;return `<div class="layout">${adminNav()}<section class="content"><div class="section-head"><div><h1 class="page-title">Uživatelské účty</h1><p class="muted">Zakládej účty a spravuj přístup do aplikace.</p></div><button onclick="openCreateUser()">＋ Založit účet</button></div><div class="table-wrap"><table><thead><tr><th>Jméno</th><th>Uživatelské jméno</th><th>Role</th><th>Stav</th><th>Akce</th></tr></thead><tbody>${users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.username)}</td><td>${u.role==="admin"?"Admin":"Student"}</td><td><span class="status ${u.blocked?"blocked":""}">${u.blocked?"Zablokovaný":"Aktivní"}</span></td><td>${u.username!==current.username?`<button class="${u.blocked?"secondary":"danger"} small" onclick="toggleBlock('${esc(u.username)}')">${u.blocked?"Odblokovat":"Blokovat"}</button>`:"—"}</td></tr>`).join("")}</tbody></table></div></section></div>`}
function openCreateUser(){if(!isAdmin()){openLogin();return}openModal(`<h2>Založit uživatelský účet</h2><p class="muted tiny">V demo verzi se účet uloží v tomto prohlížeči.</p><form onsubmit="createUser(event)"><label>Celé jméno</label><input id="newName" required maxlength="60"><label>Uživatelské jméno</label><input id="newUsername" required pattern="[a-zA-Z0-9._-]+" maxlength="30"><label>Heslo</label><input id="newPassword" type="password" required minlength="6"><label>Role</label><select id="newRole"><option value="student">Student</option><option value="admin">Administrátor</option></select><div class="modal-foot"><button type="button" class="secondary" onclick="closeModal()">Zrušit</button><button type="submit">Vytvořit účet</button></div></form>`)}
function createUser(e){e.preventDefault();let name=document.getElementById("newName").value.trim(),username=document.getElementById("newUsername").value.trim(),password=document.getElementById("newPassword").value,role=document.getElementById("newRole").value;if(users.some(u=>u.username.toLowerCase()===username.toLowerCase())){toast("Toto uživatelské jméno už existuje.");return}users.push({name,username,password,role,blocked:false});save();closeModal();render();toast("Účet byl vytvořen.")}
function toggleBlock(username){if(!isAdmin())return;let u=users.find(x=>x.username===username);if(!u||u.username===current.username)return;u.blocked=!u.blocked;save();render();toast(u.blocked?"Účet byl zablokován.":"Účet byl odblokován.")}
function deleteIdea(id){if(!isAdmin()){toast("Tuto akci může provést jen admin.");return}let i=ideas.find(x=>x.id===id);if(!i)return;openModal(`<h2>Odstranit nápad?</h2><p class="muted">Opravdu chceš odstranit „${esc(i.title)}“? V demo verzi jej lze později obnovit resetem dat.</p><div class="modal-foot"><button class="secondary" onclick="closeModal()">Zrušit</button><button class="danger" onclick="confirmDeleteIdea(${id})">Odstranit</button></div>`)}
function confirmDeleteIdea(id){ideas=ideas.filter(i=>i.id!==id);save();closeModal();if(page==="detail")page="ideas";render();toast("Nápad byl odstraněn.")}
function deleteComment(id,n){if(!isAdmin())return;let i=ideas.find(x=>x.id===id);if(i){i.comments.splice(n,1);save();render();toast("Komentář byl odstraněn.")}}
function aboutPage(){return `<div class="card"><h1 class="page-title">O projektu Secret Inbox</h1><p class="muted">Školní schránka nápadů umožňuje studentům navrhovat zlepšení školního prostředí, hlasovat a diskutovat.</p><h3>Uživatelské role</h3><ul><li><b>Návštěvník:</b> prohlíží nápady a komentáře.</li><li><b>Student:</b> přidává nápady, hlasuje a komentuje.</li><li><b>Administrátor:</b> spravuje obsah a uživatelské účty.</li></ul><div class="notice"><b>Upozornění:</b> Toto je front-end demo. Data jsou uložená v místním úložišti prohlížeče, takže nejsou sdílená mezi zařízeními. Pro reálné nasazení je potřeba backend, databáze a bezpečné ověřování hesel.</div><button class="secondary" onclick="go('home')">Zpět na úvod</button></div>`}
render();
</script>
</body>
</html>
